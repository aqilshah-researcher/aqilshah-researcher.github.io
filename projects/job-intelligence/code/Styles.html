<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2933; --muted: #5f6b7a; --line: #e3e7ec;
    --brand: #1d4ed8; --brand-ink: #ffffff; --brand-soft: #e8efff;
    --ok: #137333; --ok-soft: #e6f4ea; --warn: #9a5b00; --warn-soft: #fff4e0; --bad: #b3261e; --bad-soft: #fce8e6;
    --info: #0b57d0; --info-soft: #e8f0fe; --neutral-soft: #eef1f4;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --side: 248px;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  #app { display: flex; min-height: 100vh; }
  #sidebar { width: var(--side); background: #0f1b2d; color: #dbe3ee; display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 30; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 18px 16px 14px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .brand-title { font-weight: 700; color: #fff; }
  .brand-sub { font-size: 12px; color: #9fb0c6; }
  #nav { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .nav-group { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8193ab; padding: 14px 10px 6px; }
  .nav-item { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; color: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,.06); }
  .nav-item.active { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
  .nav-count { font-size: 12px; background: rgba(255,255,255,.1); padding: 1px 8px; border-radius: 999px; min-width: 26px; text-align: center; }
  .nav-count.alert { background: #f59e0b; color: #1f2933; }
  .side-foot { padding: 12px 16px; font-size: 12px; color: #8193ab; border-top: 1px solid rgba(255,255,255,.08); }
  .side-foot a { color: #bcd0ff; }

  #main { flex: 1; margin-left: var(--side); min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 12px 20px; background: rgba(246,247,249,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .search { flex: 1; position: relative; max-width: 720px; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .search input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .6; }
  #content { padding: 20px; max-width: 1180px; width: 100%; }
  #content:focus { outline: none; }

  .btn { border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); font-weight: 500; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.danger { background: #fff; color: var(--bad); border-color: #f1c7c3; }
  .icon-btn { border: 1px solid var(--line); background: #fff; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .pill-count { background: var(--brand); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
  .only-mobile { display: none; }

  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .view-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .view-sub { color: var(--muted); margin-top: 2px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=text], input[type=date], input[type=number], input[type=email], textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: #fff; min-width: 0;
  }
  textarea { width: 100%; resize: vertical; min-height: 70px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f > * { font-size: 14px; color: var(--ink); }
  label.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; }

  .filters { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; box-shadow: var(--shadow); }
  .filters .actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

  .cards { display: grid; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
  .card:hover { border-color: #c9d3e0; }
  .card-title { font-size: 15px; font-weight: 650; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .card-title:hover { color: var(--brand); text-decoration: underline; }
  .card-org { color: var(--muted); margin-top: 2px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .card-actions { display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--neutral-soft); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--info-soft); color: var(--info); }
  .chip.brand { background: var(--brand-soft); color: var(--brand); }
  .star { color: #d97706; }
  .score { font-weight: 700; color: var(--ink); }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); }
  .more { display: flex; justify-content: center; margin: 16px 0 30px; }
  .loading { color: var(--muted); padding: 30px 0; text-align: center; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
  .tile:hover { border-color: #c9d3e0; }
  .tile .n { font-size: 26px; font-weight: 700; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 40px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .hbar .track { background: var(--neutral-soft); border-radius: 4px; height: 10px; overflow: hidden; }
  .hbar .fill { background: var(--brand); height: 100%; border-radius: 4px; }
  .hbar .v { text-align: right; font-variant-numeric: tabular-nums; }
  .chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.plain li:last-child { border-bottom: 0; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--panel); z-index: 50; box-shadow: -8px 0 24px rgba(16,24,40,.16); display: flex; flex-direction: column; }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .drawer-head h2 { font-size: 18px; margin: 0; }
  .drawer-body { padding: 16px 18px 40px; overflow-y: auto; flex: 1; }
  .facts { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; margin: 12px 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .editbox { background: #fafbfc; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .editbox .full { grid-column: 1 / -1; }
  .evidence { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 10px; border-radius: 0 6px 6px 0; font-size: 13px; }
  .evidence.ok { border-color: var(--ok); background: var(--ok-soft); }
  .evidence.bad { border-color: var(--bad); background: var(--bad-soft); }
  .desc { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; background: #fcfcfd; border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 480px; overflow-y: auto; }
  .timeline { font-size: 13px; }
  .timeline li { display: grid; grid-template-columns: 130px 1fr; gap: 8px; }
  .section-title { font-weight: 650; margin: 18px 0 8px; }

  .modal { position: fixed; inset: 0; background: rgba(15,27,45,.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .modal-card { background: var(--panel); border-radius: 12px; width: min(480px, 100%); padding: 18px; box-shadow: 0 20px 40px rgba(16,24,40,.25); display: grid; gap: 12px; }
  .scrim { position: fixed; inset: 0; background: rgba(15,27,45,.4); z-index: 25; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1f2933; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 70; box-shadow: var(--shadow); max-width: 90vw; }
  .toast.err { background: var(--bad); }

  .rule { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .rule .inputs { display: grid; grid-template-columns: 170px 1fr 1fr; gap: 8px; }
  .rule .sample { font-size: 12px; color: var(--muted); margin-top: 6px; }

  @media (max-width: 900px) {
    #sidebar { transform: translateX(-100%); transition: transform .2s ease; }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; }
    .only-mobile { display: inline-block; }
    .grid2 { grid-template-columns: 1fr; }
    .topbar { padding: 10px 12px; }
    #content { padding: 14px 12px; }
  }
  @media (max-width: 600px) {
    .card { grid-template-columns: 1fr; }
    .card-side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
    .editbox { grid-template-columns: 1fr; }
    .facts { grid-template-columns: 110px 1fr; }
    .rule, .rule .inputs { grid-template-columns: 1fr; }
    #filterBtn { padding: 8px 10px; }
    .hbar { grid-template-columns: 110px 1fr 32px; }
  }
</style>
