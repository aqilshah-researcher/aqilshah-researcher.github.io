<!DOCTYPE html>
<html lang="en">
<head>
  
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Job Intelligence Portal · Demo</title>
  <style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1f2933; --muted: #5f6b7a; --line: #e3e7ec;
    --brand: #1d4ed8; --brand-ink: #ffffff; --brand-soft: #e8efff;
    --ok: #137333; --ok-soft: #e6f4ea; --warn: #9a5b00; --warn-soft: #fff4e0; --bad: #b3261e; --bad-soft: #fce8e6;
    --info: #0b57d0; --info-soft: #e8f0fe; --neutral-soft: #eef1f4;
    --radius: 10px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    --side: 248px;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-size: 14px; line-height: 1.45; }
  a { color: var(--brand); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button, input, select, textarea { font: inherit; color: inherit; }
  [hidden] { display: none !important; }

  #app { display: flex; min-height: 100vh; }
  #sidebar { width: var(--side); background: #0f1b2d; color: #dbe3ee; display: flex; flex-direction: column; position: fixed; inset: 0 auto 0 0; z-index: 30; }
  .brand { display: flex; gap: 10px; align-items: center; padding: 18px 16px 14px; }
  .brand-mark { width: 34px; height: 34px; border-radius: 8px; background: var(--brand); color: #fff; display: grid; place-items: center; font-weight: 700; }
  .brand-title { font-weight: 700; color: #fff; }
  .brand-sub { font-size: 12px; color: #9fb0c6; }
  #nav { flex: 1; overflow-y: auto; padding: 6px 8px; }
  .nav-group { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: #8193ab; padding: 14px 10px 6px; }
  .nav-item { display: flex; justify-content: space-between; align-items: center; width: 100%; border: 0; background: none; color: inherit; padding: 8px 10px; border-radius: 8px; cursor: pointer; text-align: left; }
  .nav-item:hover { background: rgba(255,255,255,.06); }
  .nav-item.active { background: rgba(255,255,255,.12); color: #fff; font-weight: 600; }
  .nav-count { font-size: 12px; background: rgba(255,255,255,.1); padding: 1px 8px; border-radius: 999px; min-width: 26px; text-align: center; }
  .nav-count.alert { background: #f59e0b; color: #1f2933; }
  .side-foot { padding: 12px 16px; font-size: 12px; color: #8193ab; border-top: 1px solid rgba(255,255,255,.08); }
  .side-foot a { color: #bcd0ff; }

  #main { flex: 1; margin-left: var(--side); min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; display: flex; gap: 10px; align-items: center; padding: 12px 20px; background: rgba(246,247,249,.92); backdrop-filter: blur(6px); border-bottom: 1px solid var(--line); }
  .search { flex: 1; position: relative; max-width: 720px; }
  .search input { width: 100%; padding: 10px 12px 10px 36px; border: 1px solid var(--line); border-radius: 999px; background: #fff; }
  .search input:focus { outline: 2px solid var(--brand-soft); border-color: var(--brand); }
  .search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 13px; opacity: .6; }
  #content { padding: 20px; max-width: 1180px; width: 100%; }
  #content:focus { outline: none; }

  .btn { border: 1px solid var(--brand); background: var(--brand); color: var(--brand-ink); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; }
  .btn:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: .55; cursor: default; }
  .btn.ghost { background: #fff; color: var(--ink); border-color: var(--line); font-weight: 500; }
  .btn.small { padding: 5px 10px; font-size: 13px; }
  .btn.danger { background: #fff; color: var(--bad); border-color: #f1c7c3; }
  .icon-btn { border: 1px solid var(--line); background: #fff; width: 38px; height: 38px; border-radius: 8px; cursor: pointer; font-size: 16px; }
  .pill-count { background: var(--brand); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 12px; margin-left: 4px; }
  .only-mobile { display: none; }

  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 16px; margin: 0 0 10px; }
  .view-head { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .view-sub { color: var(--muted); margin-top: 2px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  select, input[type=text], input[type=date], input[type=number], input[type=email], textarea {
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; background: #fff; min-width: 0;
  }
  textarea { width: 100%; resize: vertical; min-height: 70px; }
  label.f { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  label.f > * { font-size: 14px; color: var(--ink); }
  label.chk { display: flex; gap: 6px; align-items: center; font-size: 13px; }

  .filters { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 14px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; box-shadow: var(--shadow); }
  .filters .actions { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; }

  .cards { display: grid; gap: 10px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow); display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; }
  .card:hover { border-color: #c9d3e0; }
  .card-title { font-size: 15px; font-weight: 650; color: var(--ink); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .card-title:hover { color: var(--brand); text-decoration: underline; }
  .card-org { color: var(--muted); margin-top: 2px; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .card-side { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
  .card-actions { display: flex; gap: 6px; }
  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--neutral-soft); color: var(--muted); white-space: nowrap; }
  .chip.ok { background: var(--ok-soft); color: var(--ok); }
  .chip.warn { background: var(--warn-soft); color: var(--warn); }
  .chip.bad { background: var(--bad-soft); color: var(--bad); }
  .chip.info { background: var(--info-soft); color: var(--info); }
  .chip.brand { background: var(--brand-soft); color: var(--brand); }
  .star { color: #d97706; }
  .score { font-weight: 700; color: var(--ink); }
  .empty { text-align: center; padding: 50px 20px; color: var(--muted); background: var(--panel); border: 1px dashed var(--line); border-radius: var(--radius); }
  .more { display: flex; justify-content: center; margin: 16px 0 30px; }
  .loading { color: var(--muted); padding: 30px 0; text-align: center; }

  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; box-shadow: var(--shadow); cursor: pointer; text-align: left; }
  .tile:hover { border-color: #c9d3e0; }
  .tile .n { font-size: 26px; font-weight: 700; }
  .tile .l { color: var(--muted); font-size: 13px; }
  .grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); min-width: 0; }
  .hbar { display: grid; grid-template-columns: minmax(90px, 38%) 1fr 40px; gap: 8px; align-items: center; margin: 6px 0; font-size: 13px; }
  .hbar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .hbar .track { background: var(--neutral-soft); border-radius: 4px; height: 10px; overflow: hidden; }
  .hbar .fill { background: var(--brand); height: 100%; border-radius: 4px; }
  .hbar .v { text-align: right; font-variant-numeric: tabular-nums; }
  .chart svg { width: 100%; height: auto; display: block; }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }
  ul.plain { list-style: none; padding: 0; margin: 0; }
  ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
  ul.plain li:last-child { border-bottom: 0; }

  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(640px, 100%); background: var(--panel); z-index: 50; box-shadow: -8px 0 24px rgba(16,24,40,.16); display: flex; flex-direction: column; }
  .drawer-head { padding: 16px 18px; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
  .drawer-head h2 { font-size: 18px; margin: 0; }
  .drawer-body { padding: 16px 18px 40px; overflow-y: auto; flex: 1; }
  .facts { display: grid; grid-template-columns: 140px 1fr; gap: 6px 12px; font-size: 13px; margin: 12px 0; }
  .facts dt { color: var(--muted); }
  .facts dd { margin: 0; overflow-wrap: anywhere; }
  .editbox { background: #fafbfc; border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .editbox .full { grid-column: 1 / -1; }
  .evidence { border-left: 3px solid var(--warn); background: var(--warn-soft); padding: 8px 10px; border-radius: 0 6px 6px 0; font-size: 13px; }
  .evidence.ok { border-color: var(--ok); background: var(--ok-soft); }
  .evidence.bad { border-color: var(--bad); background: var(--bad-soft); }
  .desc { white-space: pre-wrap; font-size: 13.5px; line-height: 1.55; background: #fcfcfd; border: 1px solid var(--line); border-radius: 8px; padding: 12px; max-height: 480px; overflow-y: auto; }
  .timeline { font-size: 13px; }
  .timeline li { display: grid; grid-template-columns: 130px 1fr; gap: 8px; }
  .section-title { font-weight: 650; margin: 18px 0 8px; }

  .modal { position: fixed; inset: 0; background: rgba(15,27,45,.45); z-index: 60; display: grid; place-items: center; padding: 16px; }
  .modal-card { background: var(--panel); border-radius: 12px; width: min(480px, 100%); padding: 18px; box-shadow: 0 20px 40px rgba(16,24,40,.25); display: grid; gap: 12px; }
  .scrim { position: fixed; inset: 0; background: rgba(15,27,45,.4); z-index: 25; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #1f2933; color: #fff; padding: 10px 16px; border-radius: 8px; z-index: 70; box-shadow: var(--shadow); max-width: 90vw; }
  .toast.err { background: var(--bad); }

  .rule { display: grid; grid-template-columns: 1fr auto; gap: 10px; }
  .rule .inputs { display: grid; grid-template-columns: 170px 1fr 1fr; gap: 8px; }
  .rule .sample { font-size: 12px; color: var(--muted); margin-top: 6px; }

  @media (max-width: 900px) {
    #sidebar { transform: translateX(-100%); transition: transform .2s ease; }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; }
    .only-mobile { display: inline-block; }
    .grid2 { grid-template-columns: 1fr; }
    .topbar { padding: 10px 12px; }
    #content { padding: 14px 12px; }
  }
  @media (max-width: 600px) {
    .card { grid-template-columns: 1fr; }
    .card-side { align-items: flex-start; flex-direction: row; flex-wrap: wrap; }
    .editbox { grid-template-columns: 1fr; }
    .facts { grid-template-columns: 110px 1fr; }
    .rule, .rule .inputs { grid-template-columns: 1fr; }
    #filterBtn { padding: 8px 10px; }
    .hbar { grid-template-columns: 110px 1fr 32px; }
  }
</style>

<meta name="robots" content="noindex">
</head>
<body data-job="">
  <div id="app">
    <aside id="sidebar" aria-label="Navigation">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">JI</div>
        <div><div class="brand-title">Job Intelligence</div><div class="brand-sub">DMV data and MEL roles</div></div>
      </div>
      <nav id="nav"></nav>
      <div class="side-foot" id="sideFoot"></div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <main id="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Open menu">&#9776;</button>
        <div class="search">
          <span class="search-icon" aria-hidden="true">&#128269;</span>
          <input id="searchBox" type="search" placeholder="Search job titles, organizations, keywords" aria-label="Search jobs" autocomplete="off">
        </div>
        <button class="btn ghost" id="filterBtn" aria-expanded="false" aria-controls="filters">Filters <span id="filterCount" class="pill-count" hidden></span></button>
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh" title="Refresh">&#8635;</button>
      </header>
      <section id="content" tabindex="-1" aria-live="polite"></section>
    </main>

    <aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden></aside>
    <div id="modal" class="modal" role="dialog" aria-modal="true" hidden></div>
    <div id="toast" class="toast" role="status" hidden></div>
  </div>
  <div class="demo-bar" role="note"><b>Demo with sample data.</b> Organizations and jobs are fictional, and nothing you change is saved. <a href="/projects/job-intelligence/">Back to the case study</a></div>
<style>.demo-bar{position:fixed;left:0;right:0;bottom:0;z-index:80;background:#fff4e0;color:#5c3b00;border-top:1px solid #f3d19c;padding:8px 14px;font-size:13px;text-align:center}.demo-bar a{color:#1d4ed8;font-weight:600;margin-left:6px}.side-foot{padding-bottom:48px}#content{padding-bottom:60px}.toast{bottom:56px}</style>
<script>
/* Demo backend for the Job Intelligence Portal.
 * Replaces google.script.run with an in-browser copy of the Apps Script API (Portal.gs),
 * using fictional organizations and jobs. Nothing is saved; reload to reset. */
(function () {
  'use strict';
  var DAY = 864e5, NOW = Date.now();
  var STATUS = ['New', 'Saved', 'Applied', 'Interview', 'Offer', 'Rejected', 'Skipped', 'Closed'];
  var SKIP = ['Title not a fit', 'Seniority mismatch', 'Location not workable', 'Citizenship required', 'Clearance required',
    'Salary too low', 'Company not a fit', 'Duplicate', 'Other'];
  var ORGS = [
    ['Capital Region Health Collaborative', 'Domestic Nonprofit', 'High'],
    ['Chesapeake Evaluation Group', 'Private Company - Consulting and Research', 'High'],
    ['Potomac Learning Institute', 'Research Institution', 'Medium'],
    ['Riverbend County Government', 'Local Government', 'High'],
    ['Old Line State Department of Labor', 'Maryland State Government', 'High'],
    ['Global Futures International', 'International Development NGO', 'High'],
    ['Beltway Policy Center', 'Think Tank / Research Institute', 'Medium'],
    ['District Community Services Agency', 'DC Government', 'Medium'],
    ['Northgate University', 'University / Academic', 'Low'],
    ['Harborview Development Partners', 'Private Company - Development Contractor', 'Medium'],
    ['Evidence for Youth Alliance', 'Association / Industry Organization', 'Low'],
    ['Metro Workforce Network', 'Domestic Nonprofit', 'Medium']
  ];
  var PLAT = ['Workday', 'Greenhouse', 'GovernmentJobs', 'JobAps', 'iCIMS', 'RSS', 'Lever', 'USAJOBS API', 'Page Watch', 'ADP'];
  var LOCS = ['Rockville, MD', 'Washington, DC', 'Washington, DC (Hybrid)', 'Remote - US', 'Silver Spring, MD', 'Arlington, VA',
    'Baltimore, MD', 'Bethesda, MD (Hybrid)', 'Fairfax, VA', 'Annapolis, MD', 'Gaithersburg, MD', 'Alexandria, VA (Hybrid)'];
  var TITLES = [
    ['Monitoring, Evaluation and Learning Manager', 9, 'monitoring, evaluation; manager'], ['Senior Data Analyst', 7, 'data analyst; senior'],
    ['MEL Specialist', 6, 'mel'], ['Data and Evaluation Manager', 7, 'data and evaluation; manager'],
    ['Performance Management and Data Analyst II', 6, 'performance management and data analyst'],
    ['Research and Data Associate', 5, 'research and data'], ['Evaluation Specialist', 6, 'evaluation specialist'],
    ['Business Intelligence Analyst (Power BI)', 7, 'business intelligence; power bi'], ['Program Data Manager', 6, 'data manager'],
    ['Director of Evaluation and Learning', 8, 'evaluation and learning; director'], ['Data Quality Specialist', 5, 'data quality'],
    ['Senior MEAL Advisor', 7, 'meal; senior'], ['Assessment and Accountability Analyst', 6, 'assessment and accountability'],
    ['Health Data Analyst', 6, 'health data'], ['Research Analyst', 4, 'research analyst'], ['Impact Measurement Manager', 7, 'impact measurement; manager'],
    ['Data Visualization Specialist', 5, 'data visualization'], ['Statistician', 4, 'statistician'], ['Information Management Officer', 5, 'information management officer'],
    ['Monitoring and Evaluation Officer', 6, 'monitoring and evaluation']
  ];
  function rnd(seed) { var x = Math.sin(seed) * 10000; return x - Math.floor(x); }
  function iso(t) { return t ? new Date(t).toISOString() : ''; }
  function day(t) { var d = new Date(t); d.setHours(0, 0, 0, 0); return d.getTime(); }

  var jobs = [];
  for (var i = 0; i < 64; i++) {
    var o = ORGS[Math.floor(rnd(i + 1) * ORGS.length)], tt = TITLES[Math.floor(rnd(i + 7) * TITLES.length)];
    var loc = LOCS[Math.floor(rnd(i + 13) * LOCS.length)];
    var age = Math.floor(Math.pow(rnd(i + 3), 1.6) * 30);
    var found = NOW - age * DAY - Math.floor(rnd(i + 5) * 10) * 36e5;
    var lo = 65000 + Math.floor(rnd(i + 9) * 9) * 5000, hi = lo + 15000 + Math.floor(rnd(i + 11) * 4) * 5000;
    var r = rnd(i + 21), elig = r < 0.72 ? 'OK' : (r < 0.9 ? 'Needs Review: check wording' : (r < 0.96 ? 'Blocked: Clearance' : 'Blocked: Citizenship'));
    var ev = { 'OK': 'No citizenship or clearance requirement found. "Ability to obtain a Public Trust" is allowed.',
      'Needs Review: check wording': '"Selected candidates must pass a federal background check." Unclear wording, so it is not treated as eligible.',
      'Blocked: Clearance': '"Must hold an active Secret clearance."', 'Blocked: Citizenship': '"Applicants must be a U.S. citizen."' }[elig];
    var st = 'New', a = rnd(i + 31);
    if (age > 2) st = a < 0.18 ? 'Applied' : a < 0.26 ? 'Saved' : a < 0.31 ? 'Skipped' : a < 0.35 ? 'Interview' : a < 0.38 ? 'Closed' : 'New';
    if (elig.indexOf('Blocked') === 0) st = 'New';
    var wm = /Hybrid/.test(loc) ? 'Hybrid' : /Remote/.test(loc) ? 'Remote' : 'On-site';
    var id = 'J' + (0x3A41C00000 + i * 7919).toString(16).toUpperCase().slice(-10);
    jobs.push({
      id: id, key: 'demo|' + i, title: tt[0], company: o[0], location: loc, url: '', posted: iso(found - Math.floor(rnd(i + 41) * 2) * DAY),
      firstSeen: iso(found), lastSeen: iso(NOW - Math.floor(rnd(i + 43) * 3) * 36e5), status: st, eligibility: elig,
      eligGroup: elig === 'OK' ? 'Eligible' : (/^Blocked/.test(elig) ? 'Blocked' : 'Needs Review'), evidence: ev,
      match: rnd(i + 51) < 0.08 ? 'Possible duplicate' : 'Match', score: tt[1] + (o[2] === 'High' ? 1 : 0), terms: tt[2],
      salary: '$' + lo.toLocaleString() + ' - $' + hi.toLocaleString() + ' a year', salaryMin: lo, salaryMax: hi, workMode: wm,
      platform: PLAT[Math.floor(rnd(i + 61) * PLAT.length)], sourceFeed: o[0], category: o[1], priority: o[2],
      stillOpen: rnd(i + 71) < 0.06 ? 'No (removed)' : 'Yes', closing: rnd(i + 73) < 0.4 ? iso(NOW + Math.floor(rnd(i + 75) * 20 + 3) * DAY) : '',
      type: 'Full-time', applicationDate: (st === 'Applied' || st === 'Interview') ? iso(day(found + DAY)) : '',
      followUp: st === 'Applied' ? iso(day(found + 10 * DAY)) : '', notes: st === 'Interview' ? 'Phone screen done. Panel interview next week.' : '',
      skipReason: st === 'Skipped' ? 'Seniority mismatch' : '', remarks: '', feedbackRule: '', alert: age === 0 ? 'Queued for daily summary' : 'Yes (daily)',
      decisionDate: '', updatedAt: iso(found),
      description: tt[0] + ' at ' + o[0] + ' (fictional sample posting)\n\nAbout the role\nLead data collection, cleaning and analysis for programs across the region. Build Power BI dashboards and present findings to leadership and partners.\n\nResponsibilities\n- Design indicators and data quality checks\n- Analyze survey and administrative data in Python, R or SQL\n- Write clear reports and briefs for decision makers\n\nQualifications\n- 5+ years in data analysis or MEL\n- Experience with Power BI or Tableau\n\nThis is sample text used only for the portfolio demo.',
      history: []
    });
  }
  var rules = [
    { id: 'R1', enabled: true, type: 'TITLE_CONTAINS', pattern: 'intern', scope: '', reason: 'Not at my level', status: 'Approved', created: iso(NOW - 20 * DAY), sourceKey: '' },
    { id: 'R2', enabled: false, type: 'COMPANY', pattern: 'harborview development partners', scope: '', reason: 'Skip reason: Company not a fit', status: 'Proposed', created: iso(NOW - 2 * DAY), sourceKey: 'demo|9' }
  ];
  var settings = { alertMode: 'daily', dailyHour: 19, interval: 60, recipient: 'you@example.com', minScore: 3, maxAge: 45, allowUnknown: true, instantMinScore: 6, sendAlerts: true };

  function isMatch(it) { return /^(Match|Location unknown|Possible duplicate)$/.test(it.match); }
  function viewTest(v, it) {
    var t = Date.parse(it.firstSeen) || 0;
    switch (v) {
      case 'today': return t >= day(NOW);
      case 'week': return t >= NOW - 7 * DAY;
      case 'month': return t >= NOW - 30 * DAY;
      case 'saved': return it.status === 'Saved';
      case 'applied': return it.status === 'Applied';
      case 'interviews': return it.status === 'Interview' || it.status === 'Offer';
      case 'closed': return it.status === 'Rejected' || it.status === 'Closed';
      case 'skipped': return it.status === 'Skipped';
      case 'review': return it.eligGroup === 'Needs Review' && isMatch(it) && ['Skipped', 'Rejected', 'Closed'].indexOf(it.status) < 0;
      default: return true;
    }
  }
  function defVisible(v, it) { return ['saved', 'applied', 'interviews', 'closed', 'skipped'].indexOf(v) >= 0 || (isMatch(it) && it.eligGroup !== 'Blocked'); }
  function ruleHits(rule) {
    var p = String(rule.pattern || '').toLowerCase().trim(); if (!p) return [];
    return jobs.filter(function (it) {
      if (rule.scope && it.company.toLowerCase() !== rule.scope.toLowerCase()) return false;
      switch (rule.type) {
        case 'TITLE_CONTAINS': return it.title.toLowerCase().indexOf(p) >= 0;
        case 'TEXT_CONTAINS': return (it.title + ' ' + it.description).toLowerCase().indexOf(p) >= 0;
        case 'LOCATION_CONTAINS': return it.location.toLowerCase().indexOf(p) >= 0;

          status: top(tally(jobs, function (it) { return it.status; }), 8), eligibility: top(tally(jobs.filter(isMatch), function (it) { return it.eligGroup; }), 5),

<script>
(function () {
  'use strict';

  // ------------------------------------------------------------------ state
  var S = {
    boot: null, view: 'overview', items: [], total: 0, page: 0, hasMore: false, loading: false,
    filters: { text: '', inDesc: false, org: '', location: '', workMode: '', discFrom: '', discTo: '', postFrom: '', postTo: '',

    { id: 'saved', label: 'Saved' },
    { id: 'applied', label: 'Applied' },
    { id: 'interviews', label: 'Interviews and offers' },
    { id: 'closed', label: 'Rejected or closed' },

    { id: 'settings', label: 'Settings and health' }

  var TITLES = {}; VIEWS.forEach(function (v) { if (v.id) TITLES[v.id] = v.label; });

  // ------------------------------------------------------------------ helpers
  function $(id) { return document.getElementById(id); }

      r[fn].apply(r, args);
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';

  }
  function dayInput(iso) {
    if (!iso) return ''; var t = Date.parse(iso); if (isNaN(t)) return '';

  }
  function ago(iso) {
    var t = Date.parse(iso); if (!t) return '';

  }

  // ------------------------------------------------------------------ overview
  function bars(data, opts) {
    opts = opts || {}; var w = 640, h = 180, pad = 24, n = data.length || 1;
    var max = Math.max.apply(null, data.map(function (d) { return Math.max(d.a || 0, d.b || 0); }).concat([1]));
    var bw = (w - pad) / n, out = '';
    data.forEach(function (d, i) {
      var x = pad + i * bw, ha = (d.a || 0) / max * (h - 30), hb = (d.b || 0) / max * (h - 30);
      out += '<rect x="' + (x + 1) + '" y="' + (h - 20 - ha) + '" width="' + Math.max(1, bw - 3) + '" height="' + ha + '" fill="#c7d2fe"><title>' + esc(d.label + ': ' + (d.a || 0) + (opts.aName ? ' ' + opts.aName : '')) + '</title></rect>';
      if (opts.two) out += '<rect x="' + (x + 1) + '" y="' + (h - 20 - hb) + '" width="' + Math.max(1, bw - 3) + '" height="' + hb + '" fill="#1d4ed8"><title>' + esc(d.label + ': ' + (d.b || 0) + ' ' + (opts.bName || '')) + '</title></rect>';
      if (i % Math.ceil(n / 6) === 0) out += '<text x="' + (x + bw / 2) + '" y="' + (h - 5) + '" font-size="10" text-anchor="middle" fill="#5f6b7a">' + esc(d.short || d.label) + '</text>';
    });
    out += '<text x="0" y="12" font-size="10" fill="#5f6b7a">' + max + '</text><line x1="' + pad + '" x2="' + w + '" y1="' + (h - 20) + '" y2="' + (h - 20) + '" stroke="#e3e7ec"/>';
    return '<div class="chart"><svg viewBox="0 0 ' + w + ' ' + h + '" role="img" aria-label="' + esc(opts.label || 'chart') + '">' + out + '</svg></div>';
  }
  function hbars(list, total) {
    if (!list || !list.length) return '<div class="muted small">No data yet.</div>';

    return list.map(function (x) {
      return '<div class="hbar"><span class="name" title="' + esc(x.k) + '">' + esc(x.k) + '</span><span class="track"><span class="fill" style="width:' + (x.n / max * 100).toFixed(1) + '%;display:block"></span></span><span class="v">' + x.n + '</span></div>';
    }).join('');
  }

    }
    if (f.id === 'editForm') {
      var ch = { status: f.elements.namedItem('status').value, applicationDate: f.elements.namedItem('applicationDate').value, followUp: f.elements.namedItem('followUp').value, notes: f.elements.namedItem('notes').value, skipReason: f.elements.namedItem('skipReason').value, remarks: f.elements.namedItem('remarks').value };
      if (ch.status === 'Skipped' && !ch.skipReason) { toast('Please choose a skip reason', true); f.elements.namedItem('skipReason').focus(); return; }
      $('saveState').textContent = 'Saving...';
      return saveJob(S.current.id, ch, S.current.updatedAt);
    }
    if (f.id === 'skipForm') {
      var m = $('modal'), id = m.dataset.id;
      var it = S.items.find(function (x) { return x.id === id; }) || S.current || {};
      m.hidden = true;
      return saveJob(id, { status: 'Skipped', skipReason: f.elements.namedItem('skipReason').value, remarks: f.elements.namedItem('remarks').value }, it.updatedAt);
    }
    if (f.id === 'settingsForm') {
      var v = { alertMode: f.elements.namedItem('alertMode').value, dailyHour: f.elements.namedItem('dailyHour').value, interval: f.elements.namedItem('interval').value, instantMinScore: f.elements.namedItem('instantMinScore').value, recipient: f.elements.namedItem('recipient').value,
        minScore: f.elements.namedItem('minScore').value, maxAge: f.elements.namedItem('maxAge').value, sendAlerts: f.elements.namedItem('sendAlerts').checked, allowUnknown: f.elements.namedItem('allowUnknown').checked };
      return api('api_saveSettings', v).then(function (r) { toast(r.scheduleUpdated ? 'Settings saved and schedule updated' : 'Settings saved'); boot(); }).catch(fail);
    }
  });
  $('searchBox').addEventListener('input', debounce(function (e) {
    S.filters.text = e.target.value.trim();
    if (['overview', 'rules', 'settings'].indexOf(S.view) >= 0) { if (S.filters.text) go('all'); return; }
    renderList(true);
  }, 350));

  // ------------------------------------------------------------------ start
  function boot() {
    return api('api_bootstrap').then(function (b) {
      S.boot = b; renderNav(); render();
      var deep = document.body.getAttribute('data-job');
      if (deep) { document.body.setAttribute('data-job', ''); openJob(deep); }
    }).catch(function (e) {
      $('content').innerHTML = '<div class="empty"><b>The portal could not load.</b><br>' + esc(e.message) + '<br><br>Open the sheet and run Job Monitor &gt; 1. Set up sheet, then reload this page.</div>';
    });
  }
  renderNav();
  $('content').innerHTML = '<div class="loading">Loading your jobs...</div>';
  boot();
})();
</script>

</body>
</html>
